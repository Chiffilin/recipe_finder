<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'base:recipe_list' %}">RecipeFinder</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'base:recipe_list' %}">Головна</a>
                    </li>

                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'base:add_recipe' %}">Додати рецепт</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'fridge:fridge' %}">Холодильник</a>
                    </li>
                        <li class="nav-item dropdown">
                            <span class="nav-link dropdown-toggle"
                                  href="#"
                                  id="navbarDropdown"
                                  role="button"
                                  data-bs-toggle="dropdown"
                                  aria-expanded="false">Привіт, {{ user.username }}</span>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li>
                                    <form method="post" action="{% url 'logout' %}">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item">Вийти</button>
                                    </form>
                                </li>
                                {# Add more dropdown items here if needed #}
                            </ul>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">Увійти</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'users:register' %}">Реєстрація</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
            <form class="d-flex" method="get" action="{% url 'base:recipe_list' %}">
                <input class="form-control me-2"
                       type="search"
                       placeholder="Пошук рецептів"
                       aria-label="Search"
                       name="q"
                       value="{{ request.GET.q }}">
                <button class="btn btn-outline-success" type="submit">Пошук</button>
            </form>
    </nav>
</header>
