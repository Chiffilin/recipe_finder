services:
  app:
    build:
      target: final

    user: ${USER_ID:-1000}
    ports:
      - "60000:8000"

    volumes:
      - ./files:/wd/files
      - ./db:/wd/db

    develop:
      watch:
        - action: sync
          path: ./manage.py
          target: /wd/manage.py
        - action: sync
          path: ./apps/
          target: /wd/apps/
        - action: sync
          path: ./core/
          target: /wd/core/

        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: .python-version

    # https://docs.docker.com/reference/compose-file/services/#init
    # https://github.com/krallin/tini
    # https://github.com/krallin/tini/issues/8
    init: true

    command: runserver 0.0.0.0:8000
